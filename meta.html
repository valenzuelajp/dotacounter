<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DotaCounter — meta today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="top-bar">
    <h1 class="site-title">Meta today</h1>
    <p class="patch-label">Patch: loading…</p>
    <nav class="site-nav">
      <a class="nav-link" href="./index.html">Draft</a>
      <a class="nav-link" href="./heroes.html">Heroes</a>
      <a class="nav-link" href="./items.html">Items</a>
      <a class="nav-link nav-link-active" href="./meta.html">Meta today</a>
    </nav>
  </header>
  <main class="meta-view">
    <p class="meta-updated">Updated: loading…</p>
    <h2 class="section-title">Best picks by role</h2>
    <div class="role-list"></div>
    <h2 class="section-title">Tier list</h2>
    <div class="tier-list"></div>
  </main>
  <p class="offline-note" hidden>Showing offline data — live stats unavailable.</p>
  <script src="./js/data-loader.js"></script>
  <script>
    // meta page: two jobs — render role picks, then tiers.
    window.DotaCounter.loadData().then((data) => {
      document.querySelector(".meta-updated").textContent = "Updated: " + data.meta.updatedAt;
      const roles = document.querySelector(".role-list");
      for (const role of data.meta.roles || []) {
        const card = document.createElement("div");
        card.className = "role-card";
        const title = document.createElement("strong");
        title.className = "role-name";
        title.textContent = role.name;
        const picks = document.createElement("span");
        picks.className = "role-picks";
        picks.textContent = (role.top || []).map((h) => h.name || h.id).join(", ") || "—";
        const note = document.createElement("p");
        note.className = "role-note";
        note.textContent = role.note || "";
        card.append(title, picks, note);
        roles.appendChild(card);
      }
      const names = Object.fromEntries(data.heroes.map((h) => [h.id, h.name]));
      const list = document.querySelector(".tier-list");
      for (const tier of ["S", "A", "B", "C"]) {
        const row = document.createElement("div");
        row.className = "tier-row";
        const label = document.createElement("strong");
        label.className = "tier-label";
        label.textContent = "Tier " + tier;
        const members = document.createElement("span");
        members.className = "tier-members";
        members.textContent = ((data.meta.tiers || {})[tier] || []).map((id) => names[id] || id).join(", ") || "—";
        row.append(label, members);
        list.appendChild(row);
      }
    });
  </script>
</body>
</html>
